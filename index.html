<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaffTask - Task Management System</title>
  <style>
    /* Theme Variables */
    :root {
      --navy: #0f172a;
      --slate: #1e293b;
      --slate-light: #334155;
      --cyan: #06b6d4;
      --cyan-hover: #0891b2;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --orange: #f97316;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border: rgba(51, 65, 85, 0.3);
      --glass: rgba(30, 41, 59, 0.8);
      --glass-hover: rgba(30, 41, 59, 0.95);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, var(--navy) 0%, #1a1f3a 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 2rem 2.5rem;
      border-bottom: 2px solid var(--cyan);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-title h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--cyan), #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .task-counter {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .counter-badge {
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-size: 0.875rem;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .counter-badge strong {
      color: var(--cyan);
      margin-right: 0.25rem;
    }

    /* Main Container */
    main {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* Filters Section */
    .filters-section {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .filters-content {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1rem;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--cyan-hover));
      color: var(--navy);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
    }

    .btn-secondary {
      background: var(--slate-light);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--slate);
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-success {
      background: var(--green);
      color: white;
    }

    .btn-success:hover {
      background: #059669;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }

    /* Kanban Board */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .column {
      display: flex;
      flex-direction: column;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      min-height: 500px;
    }

    .column-header {
      padding: 1.25rem;
      border-bottom: 2px solid var(--cyan);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(6, 182, 212, 0.05));
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .column-title {
      font-size: 1.125rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .column-count {
      background: var(--cyan);
      color: var(--navy);
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      font-size: 0.875rem;
      font-weight: 600;
      min-width: 2rem;
      text-align: center;
    }

    .column-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .column.drag-over {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 1rem;
      text-align: center;
      flex: 1;
    }

    .empty-state-icon {
      font-size: 3rem;
      opacity: 0.5;
    }

    /* Task Card */
    .task-card {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.6), rgba(30, 41, 59, 0.8));
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      cursor: grab;
      transition: all 0.3s ease;
      border-left: 4px solid var(--cyan);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.2);
      border-color: var(--cyan);
    }

    .task-card.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    .task-card.priority-high {
      border-left-color: var(--red);
    }

    .task-card.priority-medium {
      border-left-color: var(--yellow);
    }

    .task-card.priority-low {
      border-left-color: var(--green);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .task-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-primary);
      flex: 1;
      word-break: break-word;
    }

    .task-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .priority-badge {
      background: var(--slate-light);
      color: var(--text-primary);
    }

    .priority-badge.high {
      background: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .priority-badge.medium {
      background: rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }

    .priority-badge.low {
      background: rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .task-assignee {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.75rem;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .task-date {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .task-date.overdue {
      color: var(--red);
    }

    .task-location {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      color: var(--cyan);
    }

    .task-description {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.4;
      max-height: 2.8em;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-countdown {
      font-size: 0.75rem;
      color: var(--cyan);
      font-weight: 500;
    }

    .task-countdown.overdue {
      color: var(--red);
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .modal-content {
      background: linear-gradient(135deg, var(--slate) 0%, var(--navy) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      padding: 2rem;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .modal-header h2 {
      font-size: 1.5rem;
      color: var(--cyan);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      background: var(--slate-light);
      color: var(--text-primary);
    }

    .form-section {
      margin-bottom: 1.5rem;
    }

    .form-section h3 {
      font-size: 0.875rem;
      color: var(--cyan);
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
    }

    .form-group textarea {
      min-height: 100px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .location-info {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 0.5rem;
    }

    .location-info p {
      margin: 0.5rem 0;
      font-size: 0.875rem;
    }

    .location-map {
      width: 100%;
      height: 200px;
      border-radius: 6px;
      margin-top: 0.75rem;
      border: 1px solid var(--border);
    }

    .activity-log {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .activity-log-item {
      padding: 0.5rem 0;
      font-size: 0.875rem;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      color: var(--text-secondary);
    }

    .activity-log-item:last-child {
      border-bottom: none;
    }

    .activity-log-time {
      color: var(--cyan);
      font-weight: 500;
      margin-right: 0.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .modal-actions button {
      flex: 1;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 2000;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .kanban-board {
        grid-template-columns: 1fr;
      }

      .filters-content {
        flex-direction: column;
      }

      .modal-content {
        width: 95%;
      }
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--slate-light);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--cyan);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="header-title">
        <h1>📋 StaffTask</h1>
      </div>
      <div class="task-counter">
        <div class="counter-badge">Total: <strong id="totalCount">0</strong></div>
        <div class="counter-badge">To Do: <strong id="todoCount">0</strong></div>
        <div class="counter-badge">In Progress: <strong id="inprogressCount">0</strong></div>
        <div class="counter-badge">Complete: <strong id="completeCount">0</strong></div>
        <div class="counter-badge">Blocked: <strong id="blockedCount">0</strong></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Filters -->
    <div class="filters-section">
      <div class="filters-content">
        <div class="filter-group" style="flex: 2;">
          <label for="searchInput">🔍 Search</label>
          <input type="text" id="searchInput" placeholder="Search by title or assignee...">
        </div>
        <div class="filter-group">
          <label for="priorityFilter">Priority</label>
          <select id="priorityFilter">
            <option value="">All</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="">All</option>
            <option value="todo">To Do</option>
            <option value="inprogress">In Progress</option>
            <option value="complete">Complete</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="assigneeFilter">Assignee</label>
          <input type="text" id="assigneeFilter" placeholder="Filter by staff name...">
        </div>
        <button class="btn btn-primary" onclick="openNewTaskModal()">➕ New Task</button>
        <button class="btn btn-secondary" onclick="clearFilters()">Reset</button>
      </div>
    </div>

    <!-- Kanban Board -->
    <div class="kanban-board" id="kanbanBoard">
      <div class="column" id="todo-column" data-status="todo">
        <div class="column-header">
          <div class="column-title">📋 To Do</div>
          <div class="column-count" id="todo-count">0</div>
        </div>
        <div class="column-body" id="todo-body">
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div>No tasks yet</div>
          </div>
        </div>
      </div>

      <div class="column" id="inprogress-column" data-status="inprogress">
        <div class="column-header">
          <div class="column-title">🔄 In Progress</div>
          <div class="column-count" id="inprogress-count">0</div>
        </div>
        <div class="column-body" id="inprogress-body">
          <div class="empty-state">
            <div class="empty-state-icon">⚙️</div>
            <div>No tasks yet</div>
          </div>
        </div>
      </div>

      <div class="column" id="complete-column" data-status="complete">
        <div class="column-header">
          <div class="column-title">✅ Complete</div>
          <div class="column-count" id="complete-count">0</div>
        </div>
        <div class="column-body" id="complete-body">
          <div class="empty-state">
            <div class="empty-state-icon">🎉</div>
            <div>No tasks yet</div>
          </div>
        </div>
      </div>

      <div class="column" id="blocked-column" data-status="blocked">
        <div class="column-header">
          <div class="column-title">🚫 Blocked</div>
          <div class="column-count" id="blocked-count">0</div>
        </div>
        <div class="column-body" id="blocked-body">
          <div class="empty-state">
            <div class="empty-state-icon">🚧</div>
            <div>No tasks yet</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">New Task</h2>
        <button class="modal-close" onclick="closeTaskModal()">✕</button>
      </div>

      <form id="taskForm" onsubmit="saveTask(event)">
        <!-- Basic Info -->
        <div class="form-section">
          <h3>Task Details</h3>
          <div class="form-group">
            <label for="taskTitle">Task Title *</label>
            <input type="text" id="taskTitle" required>
          </div>
          <div class="form-group">
            <label for="taskDescription">Description</label>
            <textarea id="taskDescription"></textarea>
          </div>
        </div>

        <!-- Assignment & Priority -->
        <div class="form-section">
          <h3>Assignment</h3>
          <div class="form-group">
            <label for="taskAssignee">Assigned Staff</label>
            <input type="text" id="taskAssignee" placeholder="e.g., John Doe">
          </div>
          <div class="form-group">
            <label for="taskPriority">Priority *</label>
            <select id="taskPriority" required>
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDueDate">Due Date</label>
            <input type="date" id="taskDueDate">
          </div>
        </div>

        <!-- Location -->
        <div class="form-section">
          <h3>Location</h3>
          <button type="button" class="btn btn-primary btn-sm" onclick="captureLocation()">
            📍 Capture My Location
          </button>
          <div id="locationInfo"></div>
        </div>

        <!-- Activity Log -->
        <div class="form-section" id="activitySection" style="display: none;">
          <h3>Activity</h3>
          <div class="activity-log" id="activityLog"></div>
        </div>

        <!-- Form Actions -->
        <div class="modal-actions">
          <button type="submit" class="btn btn-success">Save Task</button>
          <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;" onclick="deleteCurrentTask()">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ============ STATE MANAGEMENT ============
    let tasks = [];
    let currentEditingTaskId = null;
    const STORAGE_KEY = 'stafftask_tasks';

    // ============ UTILITY FUNCTIONS ============
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function getColorFromString(str) {
      const colors = [
        '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
        '#ec4899', '#14b8a6', '#f97316'
      ];
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }

    function getInitials(name) {
      return name
        .split(' ')
        .map(part => part[0])
        .join('')
        .toUpperCase()
        .substr(0, 2);
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString + 'T00:00:00');
      return new Intl.DateTimeFormat('en-US', {
        month: 'short',
        day: 'numeric',
        year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
      }).format(date);
    }

    function getDueDateStatus(dueDate) {
      if (!dueDate) return { text: '', isOverdue: false };
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dueDate + 'T00:00:00');
      const diffTime = due - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { text: `Overdue by ${Math.abs(diffDays)} day${Math.abs(diffDays) !== 1 ? 's' : ''}`, isOverdue: true };
      } else if (diffDays === 0) {
        return { text: 'Due today', isOverdue: false };
      } else if (diffDays === 1) {
        return { text: 'Due tomorrow', isOverdue: false };
      } else {
        return { text: `Due in ${diffDays} days`, isOverdue: false };
      }
    }

    // ============ LOCATION FUNCTIONS ============
    async function captureLocation() {
      const locationInfo = document.getElementById('locationInfo');
      locationInfo.innerHTML = '<p style="color: #06b6d4;">📍 Getting location...</p>';

      if (!navigator.geolocation) {
        locationInfo.innerHTML = '<p style="color: #ef4444;">Geolocation not supported</p>';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;

          try {
            const response = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`
            );
            const data = await response.json();
            const locationName = data.address.city || data.address.town || data.address.village || data.address.county || data.address.state || 'Unknown Location';

            displayLocation(latitude, longitude, locationName);

            // Store in form
            document.getElementById('taskForm').dataset.lat = latitude;
            document.getElementById('taskForm').dataset.lng = longitude;
            document.getElementById('taskForm').dataset.address = locationName;
          } catch (error) {
            console.error('Reverse geocoding failed:', error);
            displayLocation(latitude, longitude, 'Location captured (address unavailable)');
          }
        },
        (error) => {
          locationInfo.innerHTML = `<p style="color: #ef4444;">Location access denied: ${error.message}</p>`;
        }
      );
    }

    function displayLocation(lat, lng, address) {
      const locationInfo = document.getElementById('locationInfo');
      const mapUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${lng-0.01},${lat-0.01},${lng+0.01},${lat+0.01}&layer=mapnik`;

      locationInfo.innerHTML = `
        <div class="location-info">
          <p><strong>📍 ${address}</strong></p>
          <p style="font-size: 0.75rem; color: #94a3b8;">Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}</p>
          <iframe
            class="location-map"
            src="${mapUrl}"
            style="border: none; border-radius: 6px;"
            allowfullscreen=""
            loading="lazy">
          </iframe>
        </div>
      `;
    }

    // ============ TASK FUNCTIONS ============
    function createTask(formData) {
      const task = {
        id: generateId(),
        title: formData.title,
        description: formData.description,
        assignee: formData.assignee,
        priority: formData.priority,
        dueDate: formData.dueDate,
        status: 'todo',
        location: formData.location ? {
          lat: formData.location.lat,
          lng: formData.location.lng,
          address: formData.location.address
        } : null,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        activity: [{ action: 'Created', timestamp: Date.now() }]
      };
      return task;
    }

    function saveTask(event) {
      event.preventDefault();

      const formData = {
        title: document.getElementById('taskTitle').value,
        description: document.getElementById('taskDescription').value,
        assignee: document.getElementById('taskAssignee').value,
        priority: document.getElementById('taskPriority').value,
        dueDate: document.getElementById('taskDueDate').value,
        location: document.getElementById('taskForm').dataset.lat ? {
          lat: parseFloat(document.getElementById('taskForm').dataset.lat),
          lng: parseFloat(document.getElementById('taskForm').dataset.lng),
          address: document.getElementById('taskForm').dataset.address
        } : null
      };

      if (currentEditingTaskId) {
        // Update existing task
        const taskIndex = tasks.findIndex(t => t.id === currentEditingTaskId);
        if (taskIndex !== -1) {
          tasks[taskIndex] = {
            ...tasks[taskIndex],
            ...formData,
            updatedAt: Date.now()
          };
          if (!tasks[taskIndex].activity) tasks[taskIndex].activity = [];
          tasks[taskIndex].activity.push({ action: 'Updated', timestamp: Date.now() });
        }
      } else {
        // Create new task
        tasks.push(createTask(formData));
      }

      saveTasks();
      renderBoard();
      closeTaskModal();
    }

    function deleteCurrentTask() {
      if (!currentEditingTaskId) return;
      if (!confirm('Are you sure you want to delete this task?')) return;

      tasks = tasks.filter(t => t.id !== currentEditingTaskId);
      saveTasks();
      renderBoard();
      closeTaskModal();
    }

    // ============ PERSISTENCE ============
    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function loadTasks() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        tasks = stored ? JSON.parse(stored) : [];
      } catch (error) {
        console.error('Error loading tasks:', error);
        tasks = [];
      }
    }

    // ============ MODAL FUNCTIONS ============
    function openNewTaskModal() {
      currentEditingTaskId = null;
      document.getElementById('modalTitle').textContent = 'New Task';
      document.getElementById('taskForm').reset();
      document.getElementById('locationInfo').innerHTML = '';
      document.getElementById('taskForm').dataset.lat = '';
      document.getElementById('taskForm').dataset.lng = '';
      document.getElementById('taskForm').dataset.address = '';
      document.getElementById('activitySection').style.display = 'none';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('taskModal').classList.add('active');
    }

    function openTaskModal(taskId) {
      currentEditingTaskId = taskId;
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      document.getElementById('modalTitle').textContent = 'Edit Task';
      document.getElementById('taskTitle').value = task.title;
      document.getElementById('taskDescription').value = task.description;
      document.getElementById('taskAssignee').value = task.assignee;
      document.getElementById('taskPriority').value = task.priority;
      document.getElementById('taskDueDate').value = task.dueDate;

      if (task.location) {
        displayLocation(task.location.lat, task.location.lng, task.location.address);
        document.getElementById('taskForm').dataset.lat = task.location.lat;
        document.getElementById('taskForm').dataset.lng = task.location.lng;
        document.getElementById('taskForm').dataset.address = task.location.address;
      } else {
        document.getElementById('locationInfo').innerHTML = '';
      }

      // Activity Log
      if (task.activity && task.activity.length > 0) {
        document.getElementById('activitySection').style.display = 'block';
        const log = document.getElementById('activityLog');
        log.innerHTML = task.activity.map(entry => {
          const time = new Date(entry.timestamp).toLocaleTimeString();
          return `<div class="activity-log-item"><span class="activity-log-time">${time}</span>${entry.action}</div>`;
        }).reverse().join('');
      } else {
        document.getElementById('activitySection').style.display = 'none';
      }

      document.getElementById('deleteBtn').style.display = 'block';
      document.getElementById('taskModal').classList.add('active');
    }

    function closeTaskModal() {
      document.getElementById('taskModal').classList.remove('active');
      currentEditingTaskId = null;
    }

    // ============ DRAG & DROP ============
    function setupDragAndDrop() {
      const cards = document.querySelectorAll('.task-card');
      const columnBodies = document.querySelectorAll('.column-body');

      cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('taskId', card.dataset.taskId);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
        });
      });

      columnBodies.forEach(body => {
        body.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          body.parentElement.classList.add('drag-over');
        });

        body.addEventListener('dragleave', (e) => {
          if (e.target === body) {
            body.parentElement.classList.remove('drag-over');
          }
        });

        body.addEventListener('drop', (e) => {
          e.preventDefault();
          body.parentElement.classList.remove('drag-over');

          const taskId = e.dataTransfer.getData('taskId');
          const newStatus = body.parentElement.dataset.status;
          const taskIndex = tasks.findIndex(t => t.id === taskId);

          if (taskIndex !== -1) {
            const oldStatus = tasks[taskIndex].status;
            tasks[taskIndex].status = newStatus;
            tasks[taskIndex].updatedAt = Date.now();
            if (!tasks[taskIndex].activity) tasks[taskIndex].activity = [];
            tasks[taskIndex].activity.push({
              action: `Moved to ${newStatus}`,
              timestamp: Date.now()
            });

            // Confetti on complete
            if (newStatus === 'complete' && oldStatus !== 'complete') {
              celebrateCompletion();
            }

            saveTasks();
            renderBoard();
          }
        });
      });
    }

    // ============ RENDERING ============
    function renderBoard() {
      const columnStatuses = ['todo', 'inprogress', 'complete', 'blocked'];

      columnStatuses.forEach(status => {
        const body = document.getElementById(`${status}-body`);
        const count = document.getElementById(`${status}-count`);
        const columnTasks = getFilteredTasks().filter(t => t.status === status);

        count.textContent = columnTasks.length;

        if (columnTasks.length === 0) {
          body.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">
                ${status === 'todo' ? '📝' : status === 'inprogress' ? '⚙️' : status === 'complete' ? '🎉' : '🚧'}
              </div>
              <div>No tasks yet</div>
            </div>
          `;
        } else {
          body.innerHTML = columnTasks.map(task => renderTaskCard(task)).join('');
        }
      });

      updateCounters();
      setupDragAndDrop();
    }

    function renderTaskCard(task) {
      const initials = getInitials(task.assignee || 'U');
      const avatarColor = getColorFromString(task.assignee || 'Unknown');
      const dueDateStatus = getDueDateStatus(task.dueDate);

      return `
        <div class="task-card priority-${task.priority}" data-task-id="${task.id}" draggable="true" onclick="openTaskModal('${task.id}')">
          <div class="task-header">
            <div class="task-title">${task.title}</div>
            <div class="priority-badge ${task.priority}">${task.priority.toUpperCase()}</div>
          </div>
          ${task.description ? `<div class="task-description">${task.description}</div>` : ''}
          <div class="task-meta">
            ${task.assignee ? `
              <div class="task-assignee">
                <div class="avatar" style="background-color: ${avatarColor};">${initials}</div>
                <span>${task.assignee}</span>
              </div>
            ` : ''}
          </div>
          ${task.dueDate ? `
            <div class="task-date ${dueDateStatus.isOverdue ? 'overdue' : ''}">
              📅 ${formatDate(task.dueDate)}
            </div>
          ` : ''}
          ${dueDateStatus.text ? `<div class="task-countdown ${dueDateStatus.isOverdue ? 'overdue' : ''}">${dueDateStatus.text}</div>` : ''}
          ${task.location ? `<div class="task-location">📍 ${task.location.address}</div>` : ''}
        </div>
      `;
    }

    function updateCounters() {
      const allTasks = tasks;
      const statusMap = {
        'todo': 'todoCount',
        'inprogress': 'inprogressCount',
        'complete': 'completeCount',
        'blocked': 'blockedCount'
      };

      document.getElementById('totalCount').textContent = allTasks.length;

      Object.entries(statusMap).forEach(([status, elementId]) => {
        const count = allTasks.filter(t => t.status === status).length;
        document.getElementById(elementId).textContent = count;
      });
    }

    // ============ FILTERING ============
    function getFilteredTasks() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const priorityFilter = document.getElementById('priorityFilter').value;
      const statusFilter = document.getElementById('statusFilter').value;
      const assigneeFilter = document.getElementById('assigneeFilter').value.toLowerCase();

      return tasks.filter(task => {
        const matchesSearch = !searchTerm ||
          task.title.toLowerCase().includes(searchTerm) ||
          task.assignee.toLowerCase().includes(searchTerm);

        const matchesPriority = !priorityFilter || task.priority === priorityFilter;
        const matchesStatus = !statusFilter || task.status === statusFilter;
        const matchesAssignee = !assigneeFilter ||
          task.assignee.toLowerCase().includes(assigneeFilter);

        return matchesSearch && matchesPriority && matchesStatus && matchesAssignee;
      });
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('priorityFilter').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('assigneeFilter').value = '';
      renderBoard();
    }

    // ============ CONFETTI ANIMATION ============
    function celebrateCompletion() {
      const confettiCount = 50;
      const colors = ['#06b6d4', '#10b981', '#f59e0b', '#ef4444'];

      for (let i = 0; i < confettiCount; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.top = '-10px';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = '50%';
        confetti.style.animation = `fall ${2 + Math.random() * 1}s linear forwards`;

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
      }
    }

    // Add CSS animation for confetti
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(${window.innerHeight}px) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    // ============ EVENT LISTENERS ============
    document.getElementById('searchInput').addEventListener('input', renderBoard);
    document.getElementById('priorityFilter').addEventListener('change', renderBoard);
    document.getElementById('statusFilter').addEventListener('change', renderBoard);
    document.getElementById('assigneeFilter').addEventListener('input', renderBoard);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeTaskModal();
    });

    // ============ INITIALIZATION ============
    loadTasks();
    renderBoard();
  </script>
</body>
</html>
